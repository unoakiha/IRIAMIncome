<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#fff6fa"><title>IRIAM 耐久支援ツール</title><link rel="stylesheet" href="style.css"></head><body><main><header><div class="spark" aria-hidden="true">✦</div><div class="eyebrow">STREAMING COMPANION</div><h1>IRIAM 耐久支援ツール</h1><p>ひと押しずつ、ゴールに近づこう。<br>配信中の人数カウントを、もっと気軽に。</p></header><section id="cards" aria-label="耐久一覧"></section><button class="addcard" id="add">＋ 耐久を追加</button><p class="save" id="save">このブラウザに自動保存されます</p><div class="notice" id="global" role="status"></div></main><dialog id="dialog"><form method="dialog" id="countform"><h2 style="font-size:19px;margin:0 0 16px">現在の人数を変更</h2><label for="newcount" style="display:block;margin-bottom:8px;font-size:13px">現在の人数</label><input id="newcount" type="number" step="1" required><div class="dialogactions"><button type="button" id="cancel">キャンセル</button><button type="submit">変更する</button></div></form></dialog><script src="app.js" defer></script></body></html>
